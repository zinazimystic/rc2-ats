# Production-style compose for a single EC2 host (no SSM: all config comes from backend/.env on the server).
#
#   docker compose -f docker-compose.ec2.yml up -d --build
#
# Only the web container is published (port 80). The API is reachable only inside the compose network;
# the browser talks to web, and Next.js proxies /api/* to api:8000.
# Over plain HTTP keep COOKIE_SECURE "false". If you put HTTPS in front (Caddy/ALB), change it to "true".
services:
  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "false"
    volumes:
      - api-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Next.js rewrites are baked at build time
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:3000"
    restart: unless-stopped

volumes:
  api-data:
